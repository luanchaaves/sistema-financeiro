services:
  controle-financeiro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controle-financeiro-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - AUTO_SEED=true
    volumes:
      - finance_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/summary"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  finance_data:
    driver: local
